<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Northstar Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="announcement">
      Free shipping on orders over $75 <span>✦</span> Thoughtful goods, made to
      last
    </div>
    <header class="site-header">
      <a class="brand" href="/">NORTHSTAR<span>MARKET</span></a>
      <nav><a href="/">Shop all</a><a href="/#story">Our story</a></nav>
      <div class="header-actions">
        <button class="icon-button" id="accountButton">◯</button
        ><button class="cart-button" id="cartButton">
          Cart <b id="cartCount">0</b>
        </button>
      </div>
    </header>
    <main>
      <div class="product-detail" id="productDetail">
        <div class="loading">Loading product...</div>
      </div>
    </main>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="cart-drawer" id="cartDrawer">
      <div class="drawer-header">
        <h2>Your cart</h2>
        <button class="close-button" data-close>×</button>
      </div>
      <div id="cartItems"></div>
      <div class="cart-footer">
        <div><span>Subtotal</span><strong id="cartTotal">$0.00</strong></div>
        <button class="button button-dark full-width" id="checkoutButton">
          Checkout <span>↗</span>
        </button>
      </div>
    </aside>
    <div class="modal-backdrop" id="accountModal">
      <div class="modal">
        <button class="close-button" data-close>×</button>
        <div id="accountContent"></div>
      </div>
    </div>
    <div class="modal-backdrop" id="checkoutModal">
      <div class="modal">
        <button class="close-button" data-close>×</button>
        <div id="checkoutContent"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
